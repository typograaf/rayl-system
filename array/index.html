<!doctype html>
<meta charset="utf-8" />
<title>Rayl array — the six layouts</title>
<style>
  body {
    margin: 0;
    font:
      12px/1.2 system-ui,
      sans-serif;
    background: #f7f7ef;
    color: #1c1c1a;
  }
  h2 {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 6px;
    opacity: 0.6;
  }
  .wide {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 24px;
  }
  .tall {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding: 0 24px 24px;
  }
  .h {
    aspect-ratio: 16 / 9;
  }
  .v {
    aspect-ratio: 9 / 16;
  }
  .sheet {
    background: linear-gradient(180deg, #cfcfc1, #f7f7ef);
  }
</style>
<script>
  window.RAYL_ARRAY_HOME = "/";
</script>

<div class="wide">
  <div>
    <h2>plates horizontal</h2>
    <div class="h sheet" data-rayl-array="plate" data-layout="horizontal"></div>
  </div>
  <div>
    <h2>cards horizontal</h2>
    <div class="h sheet" data-rayl-array="card" data-layout="horizontal"></div>
  </div>
  <div>
    <h2>baskets horizontal</h2>
    <div
      class="h sheet"
      data-rayl-array="basket"
      data-layout="horizontal"
    ></div>
  </div>
</div>
<div class="tall">
  <div>
    <h2>plates vertical</h2>
    <div class="v sheet" data-rayl-array="plate" data-layout="vertical"></div>
  </div>
  <div>
    <h2>cards vertical</h2>
    <div class="v sheet" data-rayl-array="card" data-layout="vertical"></div>
  </div>
  <div>
    <h2>baskets vertical</h2>
    <div class="v sheet" data-rayl-array="basket" data-layout="vertical"></div>
  </div>
</div>

<script type="module" src="/src/index.js"></script>
