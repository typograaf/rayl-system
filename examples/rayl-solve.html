<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rayl-solve</title>

<script src="https://typograaf.github.io/rayl-system/rayl.js?v=7be12ba8"></script>

</head>

<body class="rayl">

<div class="rayl-grid">

  <div class="rayl-stack rayl-gap-12">
    <span class="rayl-solve" data-size="150"></span>
    <span class="rayl-label">Running</span>
    <span class="rayl-line" data-label="landed"></span>
  </div>

  <div class="rayl-stack rayl-gap-12">
    <span class="rayl-solve" data-size="150" data-play="still"></span>
    <span class="rayl-label">Still</span>
    <span class="rayl-line" data-label="still"></span>
  </div>

  <div class="rayl-stack rayl-gap-12">
    <span class="rayl-solve" data-size="150" data-turn="900" data-scramble="900"
          data-gap="220" data-hold="2400"></span>
    <span class="rayl-label">Its own numbers</span>
    <span class="rayl-line" data-label="landed"></span>
  </div>

  <div class="rayl-stack rayl-gap-12">
    <span class="rayl-solve" data-size="60"></span>
    <span class="rayl-label">At sixty</span>
    <span class="rayl-line" data-label="landed"></span>
  </div>

</div>

<script>
"use strict";
/* ---------------------------------------------------------- the demo only --
 * rayl.js upgrades every .rayl-solve on its own. All this page adds is a
 * rolling line hung off each one, so the phase it is in can be read — and it
 * is the worked example of how a host listens to rayl:change.                */
[].forEach.call(document.querySelectorAll(".rayl-solve"), function(el){
  var line = el.parentNode.querySelector(".rayl-line");
  if (line) el.addEventListener("rayl:change", function(e){
    if (line.__rayl && line.__rayl.to) line.__rayl.to(e.detail.phase);
  });
});
</script>

</body>
</html>
